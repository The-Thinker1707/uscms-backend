<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCMS - Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }

        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 440px; padding: 2.25rem; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        .auth-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); }

        .brand { display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; color: #fff; }
        .brand-title { font-size: 1.4rem; font-weight: 800; }

        .auth-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.25rem; margin-bottom: 1.75rem; }
        .toggle-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 0.6rem; font-size: 0.85rem; font-weight: 700; font-family: inherit; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .toggle-btn.active { background: var(--primary); color: #fff; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.25rem; }
        label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
        input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--primary); }

        .btn-submit { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; border: none; padding: 0.85rem; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 0.5rem; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.95; }
        .nav-back { display: block; text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <div class="brand-icon">U</div>
            <div class="brand-title">USCMS Portal</div>
        </div>

        <div class="auth-toggle">
            <button id="tab-login" class="toggle-btn active" onclick="showForm('login')">Sign In</button>
            <button id="tab-register" class="toggle-btn" onclick="showForm('register')">Create Account</button>
        </div>

        <form id="login-form" onsubmit="handleAuth(event, 'login')">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" required placeholder="student@university.ac.za">
            </div>
            <div class="form-group">
                <label for="login-pass">Password</label>
                <input type="password" id="login-pass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Sign In to Account</button>
        </form>

        <form id="register-form" onsubmit="handleAuth(event, 'register')" style="display: none;">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" required placeholder="e.g. Maka N.">
            </div>
            <div class="form-group">
                <label for="reg-email">University Email</label>
                <input type="email" id="reg-email" required placeholder="maka@university.ac.za">
            </div>
            <div class="form-group">
                <label for="reg-studentid">Student / Staff ID</label>
                <input type="text" id="reg-studentid" required placeholder="ST-89402">
            </div>
            <div class="form-group">
                <label for="reg-role">Role</label>
                <select id="reg-role">
                    <option value="Athlete">Student Athlete</option>
                    <option value="Captain">Team Captain</option>
                    <option value="Coach">Coach / Staff</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg-pass">Password</label>
                <input type="password" id="reg-pass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Register Account</button>
        </form>

        <a href="index.html" class="nav-back">Return to Sports Directory</a>
    </div>

    <script>
        function showForm(mode) {
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
        }

        function handleAuth(event, mode) {
            event.preventDefault();
            let user;
            if (mode === 'register') {
                user = {
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    studentId: document.getElementById('reg-studentid').value,
                    role: document.getElementById('reg-role').value,
                    enrolledSports: [1, 2]
                };
            } else {
                const email = document.getElementById('login-email').value;
                user = {
                    name: email.split('@')[0].toUpperCase(),
                    email: email,
                    studentId: "ST-" + Math.floor(10000 + Math.random() * 90000),
                    role: "Athlete",
                    enrolledSports: [1, 3]
                };
            }
            localStorage.setItem('uscms_user', JSON.stringify(user));
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
