<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USCMS - Sports Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --danger: #ef4444;
            --success: #10b981;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 2.5rem 1.5rem; }
        .container { max-width: 1100px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
        .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; }
        .brand-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; color: #fff; }
        .brand-title { font-size: 1.5rem; font-weight: 800; }
        .brand-subtitle { font-size: 0.85rem; color: var(--text-muted); }

        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .btn-auth { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; text-decoration: none; transition: opacity 0.2s; }
        .btn-auth:hover { opacity: 0.9; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
        .stat-value { font-size: 1.75rem; font-weight: 800; color: var(--text-main); }

        .section-header { font-size: 1.2rem; font-weight: 700; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.25s ease; position: relative; cursor: pointer; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--primary), var(--accent)); opacity: 0; transition: opacity 0.25s; }
        .card:hover { transform: translateY(-4px); border-color: #475569; box-shadow: var(--shadow); }
        .card:hover::before { opacity: 1; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 0.5rem; }
        .card-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
        .badge { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        .description { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem; flex-grow: 1; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; }
        .cap-tag { font-weight: 600; color: var(--accent); }
        
        .btn-view { background: rgba(6, 182, 212, 0.12); color: var(--accent); border: 1px solid rgba(6, 182, 212, 0.3); padding: 0.4rem 0.85rem; border-radius: 6px; font-size: 0.8rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
        .btn-view:hover { background: var(--accent); color: #0f172a; }

        #toast-container { position: fixed; bottom: 2rem; right: 2rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 1000; }
        .toast { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 0.85rem 1.25rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600; box-shadow: var(--shadow); display: flex; align-items: center; gap: 0.5rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <a href="index.html" class="brand">
                <div class="brand-icon">U</div>
                <div>
                    <div class="brand-title">USCMS Directory</div>
                    <div class="brand-subtitle">University Sports & Club Management System</div>
                </div>
            </a>
            <div class="nav-actions" id="auth-nav-container">
                <a href="auth.html" class="btn-auth">Login / Register</a>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Total Disciplines</span>
                <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Combined Capacity</span>
                <span class="stat-value" id="stat-capacity">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Database Status</span>
                <span class="stat-value" style="color: var(--success); font-size: 1.3rem; margin-top: 0.3rem;">Connected</span>
            </div>
        </div>

        <div class="section-header">
            <span>Active Sports Programs</span>
        </div>
        <div id="sports-grid" class="grid">Loading sports records...</div>
    </div>

    <div id="toast-container"></div>

    <script>
        const API_URL = 'http://localhost:8080/api/sports';

        function checkAuth() {
            const user = JSON.parse(localStorage.getItem('uscms_user'));
            const container = document.getElementById('auth-nav-container');
            if (user) {
                container.innerHTML = `
                    <a href="dashboard.html" class="btn-auth" style="background: var(--surface); border: 1px solid var(--border);">My Dashboard (${user.name})</a>
                `;
            }
        }

        async function loadSports() {
            const grid = document.getElementById('sports-grid');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const sports = await response.json();
                
                document.getElementById('stat-total').textContent = sports.length;
                const totalCap = sports.reduce((acc, curr) => acc + (curr.capacity || 0), 0);
                document.getElementById('stat-capacity').textContent = totalCap;

                if (sports.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">No sports registered in Supabase database.</p>';
                    return;
                }

                grid.innerHTML = sports.map(sport => `
                    <div class="card" onclick="window.location.href='sport.html?id=${sport.id}'">
                        <div>
                            <div class="card-header">
                                <h3 class="card-title">${sport.name}</h3>
                                <span class="badge">${sport.slug}</span>
                            </div>
                            <p class="description">${sport.description || 'No description provided.'}</p>
                        </div>
                        <div class="card-footer">
                            <span class="cap-tag">Capacity: ${sport.capacity}</span>
                            <a href="sport.html?id=${sport.id}" class="btn-view" onclick="event.stopPropagation()">View Details</a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                grid.innerHTML = `<p style="color: var(--danger); grid-column: 1/-1;">Connection Failed: ${error.message}</p>`;
            }
        }

        checkAuth();
        loadSports();
    </script>
</body>
</html>
